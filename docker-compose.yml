version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyberrakshak-soc
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberrakshak-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    profiles:
      - fastapi
